# Runs the test suite on every push and pull request (C07).
# No Snowflake credentials here: the [live] contract tests skip, everything else runs on
# the mock data layer. Deploying to Snowflake stays a manual step (deploy/deploy_app.py).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and contract tests (mock data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # same as deploy/sis/environment.yml and the Community Cloud app
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt
      - run: pip install -r app/requirements.txt -r tests/requirements.txt
      - run: python -m pytest -q
      - name: Deploy plan (no connection)
        run: python deploy/deploy_app.py --dry-run

  browser:
    name: Every screen in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt
      - run: pip install -r app/requirements.txt -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m ui -q
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/ui/_screenshots/
          if-no-files-found: ignore
