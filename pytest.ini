[pytest]
# The contract (docs/CONTRACT.md) as executable checks. See .agents/tasks/claude/C04_tests.md.
#   pytest            unit + contract tests on mock data; live variants skip without Snowflake
#   pytest -m live    only the live variants (needs SNOWFLAKE_CONNECTION_NAME)
#   pytest -m ui      browser tests (Playwright + Chromium) against a local Streamlit server
testpaths = tests
addopts = -m "not ui"
markers =
    mock: offline, against the mock data layer (applied automatically)
    live: against real Snowflake; skips when no session can be opened
    ui: in a real browser against the running app; excluded unless -m ui
